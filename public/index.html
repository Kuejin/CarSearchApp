<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Jua&display=swap"
      rel="stylesheet"
    />
    <title>Car Search</title>
    <style>
      html,
      body {
        overflow-x: hidden;
      }
      body {
        margin: 0;
        font-family: sans-serif;
        background:
          radial-gradient(
            circle at top left,
            #bfe7ff 0%,
            rgba(255, 255, 255, 0) 45%
          ),
          radial-gradient(
            circle at top right,
            #d8c7ff 0%,
            rgba(191, 231, 255, 0) 45%
          ),
          radial-gradient(
            circle at bottom,
            #ccd7ff 0%,
            rgba(216, 199, 255, 0) 45%
          ),
          linear-gradient(135deg, #ffffff 0%, #dff3ff 55%, #ddd2ff 100%);
        background-attachment: fixed;
        color: #1591dc;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        position: relative;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(
            circle at 20% 15%,
            rgba(255, 255, 255, 0.85),
            transparent 28%
          ),
          radial-gradient(
            circle at 85% 20%,
            rgba(122, 215, 255, 0.4),
            transparent 30%
          ),
          radial-gradient(
            circle at 50% 90%,
            rgba(188, 163, 255, 0.35),
            transparent 32%
          );
        pointer-events: none;
        z-index: -1;
      }
      body::after {
        content: "";
        position: fixed;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        right: -160px;
        top: -120px;
        background: radial-gradient(
          circle,
          rgba(110, 215, 255, 0.28),
          rgba(181, 163, 255, 0.12),
          transparent 72%
        );
        filter: blur(35px);
        z-index: -1;
        animation: floatGlow 10s ease-in-out infinite;
      }
      .search-group {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        /* 0.5초 대기 후 중앙으로 내려옴 */
        animation: slideToCenter 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s
          forwards;
      }
      .search-group.searched {
        animation: slideToTop 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      .header {
        position: fixed; /* 다시 상단 고정 */
        top: 0;
        left: 0;
        width: 100%;
        box-sizing: border-box; /* 패딩을 포함해서 100%를 맞춤 (가로 잘림 해결) */
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        color: #1591dc;
        font-family: "Great Vibes", cursive;
        font-size: 31px;
        font-weight: bold;
        padding: 12px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 8px 30px rgba(160, 170, 255, 0.15);
        z-index: 1000;
        transition:
          background 1.2s ease,
          color 1.2s ease,
          box-shadow 1.2s ease,
          transform 0.5s ease;
        text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
        letter-spacing: 1px;
      }
      .underline {
        text-decoration: underline;
      }
      .header.picked {
        background: linear-gradient(135deg, #66d0ff, #7eaeff, #bb9cff);
        color: white;
        box-shadow: 0 12px 35px rgba(118, 170, 255, 0.35);
        transform: scale(1.01);
      }
      .tabs {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 20px;
        width: 100%;
        max-width: 550px;
        margin-top: 80px; /* 다시 80px로 원복 */
      }
      .tab-button {
        flex: 1;
        padding: 13px 0;
        font-size: 17px;
        font-weight: 600;
        border: none;
        background: transparent;
        color: #7d8ea8;
        border-radius: 9999px;
        cursor: pointer;
        transition: all 0.35s ease;
      }
      .tab-button.active {
        background: linear-gradient(135deg, #67cbff, #7db8ff, #b395ff);
        color: white;
        font-weight: bold;
        box-shadow: 0 8px 22px rgba(108, 170, 255, 0.3);
        transform: translateY(-2px);
      }
      .tab-button:hover:not(.active) {
        background: rgba(255, 255, 255, 0.35);
        backdrop-filter: blur(10px);
        color: #1591dc;
      }
      #search_keyword {
        padding: 12px 30px;
        color: #193c67;
        height: 70px;
      }
      .section {
        display: none;
        width: 100%;
        max-width: 550px;
        background: transparent;
        padding: 0 20px 10px 20px;
        border-radius: 10px;
      }
      .section.active {
        display: block;
      }
      input {
        display: block;
        width: 100%;
        max-width: 500px;
        margin: 5px auto;
        padding: 12px;
        font-size: 17px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.88) 0%,
          rgba(255, 255, 255, 0.58) 18%,
          rgba(255, 255, 255, 0.4) 100%
        );
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-top: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 9999px;
        box-sizing: border-box;
        outline: none;
        color: #193c67;
        font-weight: 600;
        letter-spacing: 0.3px;
        box-shadow:
          inset 0 2px 2px rgba(255, 255, 255, 0.95),
          inset 0 -1px 1px rgba(255, 255, 255, 0.25),
          0 10px 28px rgba(17, 34, 64, 0.1);
        transition: all 0.25s ease;
        caret-color: #4e8fd8;
      }
      input.invalid {
        border: 2px solid red;
      }
      input:hover {
        transform: translateY(-1px);
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.95),
          rgba(255, 255, 255, 0.65)
        );
        box-shadow:
          inset 0 2px 2px rgba(255, 255, 255, 0.95),
          0 14px 30px rgba(17, 34, 64, 0.12);
      }
      input:focus {
        transform: translateY(-2px);
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 1),
          rgba(255, 255, 255, 0.72)
        );
        border-color: #7baeff;
        box-shadow:
          inset 0 2px 2px rgba(255, 255, 255, 1),
          0 0 0 4px rgba(123, 174, 255, 0.16),
          0 16px 34px rgba(17, 34, 64, 0.14);
      }
      #task_desc::placeholder {
        color: #4d4d4d;
      }
      input::placeholder {
        color: #8a9bb3;
        font-weight: 500;
      }
      #car_number,
      #add_car_number {
        padding: 20px;
        font-weight: bold;
      }
      .input-group {
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      .input-group input {
        width: 100%;
        max-width: 245px;
      }
      button {
        width: 100%;
        max-width: 500px;
        padding: 14px;
        font-size: 18px;
        background-color: #c4e2f5;
        border: none;
        border-radius: 9999px;
        cursor: pointer;
        margin: 0px auto 0;
      }
      .enter {
        background: linear-gradient(135deg, #69d2ff, #7bbdff, #b59cff);
        color: white;
        margin: 20px auto 0;
        display: block;
        border: none;
        box-shadow:
          inset 0 1px 1px rgba(255, 255, 255, 0.55),
          0 10px 25px rgba(100, 150, 255, 0.25);
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease,
          filter 0.25s ease;
      }
      button:hover {
        background-color: #c4e2f5;
        color: #1591dc;
      }
      .enter:hover {
        transform: translateY(-2px) scale(1.015);
        filter: brightness(1.05);
        box-shadow:
          inset 0 1px 1px rgba(255, 255, 255, 0.6),
          0 18px 35px rgba(110, 160, 255, 0.35);
      }
      .enter:active {
        transform: translateY(1px) scale(0.985);
        box-shadow:
          inset 0 2px 3px rgba(0, 0, 0, 0.08),
          0 6px 12px rgba(110, 160, 255, 0.18);
      }
      .task-item {
        margin-bottom: 20px;
        border-bottom: 1px solid #1591dc;
        padding-bottom: 10px;
        font-size: 1.2em;
        font-family: "Jua", sans-serif;
        background-color: white;
        border-radius: 10px;
        box-shadow: 0 6px 15px rgb(21, 145, 220, 0.35);
        padding: 15px;
      }
      .task-item button {
        float: right;
        width: 2.7em;
        height: 27px;
        font-size: 0.7em;
        font-family: "Jua", sans-serif;
        background-color: #c4e2f5;
        cursor: pointer;
        color: rgb(255, 57, 57);
        padding: 0;
      }
      .task-board {
        max-width: 550px;
        width: 100%;
        background-color: white;
        color: rgb(77, 77, 77);
        font-size: 1.2em;
        font-weight: bold;
        padding: 15px;
        border-radius: 10px;
        max-height: 400px;
        overflow-y: auto;
        font-family: "Jua", sans-serif;
        box-shadow: 0 6px 15px rgb(21, 145, 220, 0.35);
        margin-top: 20px;
      }
      #result {
        max-width: 550px;
        width: 100%;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.6),
          rgba(255, 255, 255, 0.34)
        );
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.55);
        box-shadow:
          0 30px 60px rgba(90, 120, 180, 0.15),
          inset 0 2px 2px rgba(255, 255, 255, 0.95),
          inset 0 -1px 1px rgba(255, 255, 255, 0.2);
        color: #173a63;
        padding: 0 18px;
        max-height: 420px;
        overflow-y: auto;
        font-size: 1.2em;
        font-weight: bold;
        font-family: "Jua", sans-serif;
        opacity: 0;
        transform: translateY(15px) scale(0.98);
        transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        margin-top: 25px;
      }
      #result.show {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      span.slash {
        color: #4e8fd8;
      }
      .result-item {
        padding: 15px 0px;
        font-size: 1.2em;
        border-top: 2px solid #1591dc;
        font-family: "Jua", sans-serif;
        color: #173a63;
        transition:
          transform 0.25s ease,
          background 0.25s ease,
          box-shadow 0.25s ease;
        opacity: 0;
        transform: translateY(12px);
        animation: fadeCard 0.35s ease forwards;
      }
      .result-item button {
        float: right;
        width: 2.7em;
        height: 27px;
        font-size: 0.7em;
        font-family: "Jua", sans-serif;
        background-color: #c4e2f5;
        cursor: pointer;
        color: rgb(255, 57, 57);
        padding: 0;
      }
      .result-item input.inline-edit {
        display: inline-block;
        width: auto;
        min-width: 80px;
        font-size: inherit;
        font-family: inherit;
        padding: 2px 4px;
        margin: 0 3px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.65);
        color: #173a63;
        box-shadow: none;
      }
      @media (max-width: 600px) {
        body {
          padding: 16px;
        }
        .tabs {
          flex-direction: row;
          flex-wrap: wrap;
          justify-content: center;
          gap: 10px;
          margin-top: 80px;
        }
        .tab-button {
          flex: 1 1 45%;
        }
        .input-group {
          flex-direction: row;
          flex-wrap: wrap;
          gap: 10px;
          justify-content: center;
        }
        .input-group input {
          flex: 1 1 45%;
          max-width: none;
        }
        input,
        .input-group input {
          width: 100%;
          font-size: 16px;
          padding: 14px;
        }
        .enter {
          font-size: 18px;
          padding: 16px;
        }
        #result {
          font-size: 15px;
          padding: 12px;
        }
        .header {
          font-size: 22px;
          top: 12px;
          left: 12px;
        }
      }
      @keyframes slideToCenter {
        0% {
          margin-top: 0;
        }
        100% {
          margin-top: 25vh; /* 화면의 1/4 지점만큼 밀어내림 (숫자 조절 가능) */
        }
      }
      @keyframes floatGlow {
        0% {
          transform: translateY(0px) translateX(0px);
        }
        50% {
          transform: translateY(25px) translateX(-20px);
        }
        100% {
          transform: translateY(0px) translateX(0px);
        }
      }
      @keyframes fadeCard {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes slideToTop {
        0% {
          margin-top: 25vh; /* 내려와 있던 위치 */
        }
        100% {
          margin-top: 0; /* 원래 위치(상단)로 복귀 */
        }
      }
    </style>
  </head>
  <body>
    <div class="header">Car <span class="underline">Info</span></div>
    <div class="search-group">
      <div class="tabs">
        <button class="tab-button active" onclick="showTab('search')">
          차량 검색
        </button>
        <button class="tab-button" onclick="showTab('add')">차량 추가</button>
      </div>
      <!-- 차량 검색 -->
      <div id="search" class="section active">
        <form
          id="search-form"
          onsubmit="
            event.preventDefault();
            searchCar();
          "
        >
          <input
            id="search_keyword"
            placeholder="🔍 차량번호 · 차주 · 연락처 · 차종 · 색상"
          />
          <button type="submit" class="enter">Search</button>
        </form>
      </div>
      <!-- 차량 추가 -->
      <div id="add" class="section">
        <form
          id="add-form"
          onsubmit="
            event.preventDefault();
            addCar();
          "
        >
          <input placeholder="차량번호" id="add_car_number" />
          <div class="input-group">
            <input placeholder="차종" id="add_car_type" />
            <input placeholder="색상" id="add_car_color" />
          </div>
          <div class="input-group">
            <input placeholder="차주1" id="add_owner_name" />
            <input placeholder="연락처1" id="add_phone_number" />
          </div>
          <div class="input-group">
            <input placeholder="차주2" id="add_owner_name2" />
            <input placeholder="연락처2" id="add_phone_number2" />
          </div>
          <button type="submit" class="enter">Add</button>
        </form>
      </div>
    </div>
    <div id="result"></div>
    <script>
      const header = document.querySelector(".header");
      document.addEventListener("click", (e) => {
        if (e.target.tagName.toLowerCase() === "input") {
          header.classList.add("picked");
        } else {
          header.classList.remove("picked");
        }
      });
      async function searchCar(silent = false) {
        const keyword = document.getElementById("search_keyword").value.trim();
        const searchGroup = document.querySelector(".search-group"); // 검색 그룹 선택
        if (!keyword) {
          const resultDiv = document.getElementById("result");
          resultDiv.classList.remove("show");
          resultDiv.innerHTML = "";
          // 검색어가 없으면 다시 중앙으로 내려오게 원상복구
          searchGroup.classList.remove("searched");
          if (!silent) {
            alert("검색어를 입력해주세요.");
          }
          return;
        }
        const params = new URLSearchParams();
        params.append("keyword", keyword);
        try {
          const res = await fetch(`/search?${params}`);
          const data = await res.json();
          const resultDiv = document.getElementById("result");
          resultDiv.classList.remove("show");
          resultDiv.innerHTML = "";
          if (Array.isArray(data) && data.length > 0) {
            data.forEach((car) => {
              renderCarItem(car);
            });
            setTimeout(() => {
              resultDiv.classList.add("show");
              // 결과가 화면에 뜰 때 검색창들을 위로 올림
              searchGroup.classList.add("searched");
            }, 10);
          } else {
            if (!silent) {
              alert("찾아도 안보여요");
            }
          }
        } catch (err) {
          console.error("검색 오류:", err);
          alert("검색 중 오류가 발생했습니다.");
        }
      }
      async function addCar() {
        // 필수값만 체크
        const requiredIds = [
          "add_car_number",
          "add_car_type",
          "add_car_color",
          "add_owner_name",
          "add_phone_number",
        ];
        const allFilled = requiredIds.every(
          (id) => document.getElementById(id).value.trim() !== "",
        );
        if (!allFilled) {
          alert("필수 정보를 채워주세요");
          return;
        }
        // body는 그대로 (2번은 없어도 OK)
        const body = {
          car_number: document.getElementById("add_car_number").value,
          car_type: document.getElementById("add_car_type").value,
          car_color: document.getElementById("add_car_color").value,
          owner_name: document.getElementById("add_owner_name").value,
          owner_name2: document.getElementById("add_owner_name2").value || null,
          phone_number: document.getElementById("add_phone_number").value,
          phone_number2:
            document.getElementById("add_phone_number2").value || null,
        };
        const res = await fetch("/add", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (data.message && data.message.includes("완료!")) {
          alert("등록 성공!");
          // 입력 초기화
          [
            "add_car_number",
            "add_car_type",
            "add_car_color",
            "add_owner_name",
            "add_owner_name2",
            "add_phone_number",
            "add_phone_number2",
          ].forEach((id) => (document.getElementById(id).value = ""));
        } else {
          alert(data.message || "등록 실패!");
        }
      }
      function renderCarItem(car) {
        const item = document.createElement("div");
        item.className = "result-item";
        function renderViewMode() {
          item.innerHTML = `
          <div>
            <span class="slash">차주</span>
            <div>
              ${car.owner_name} (${car.phone_number})
            </div>
            ${car.owner_name2 ? `<div>${car.owner_name2} (${car.phone_number2 || ""})</div>` : ""}
          </div>
          <div style="margin-top: 10px;">
            <span class="slash">차량</span>
            <div>
              ${car.car_number}
              <span class="slash">/</span> ${car.car_type}
              <span class="slash">/</span> ${car.car_color}
              <button onclick="deleteCar(${car.id})">삭제</button>
              <button class="edit-btn">수정</button>
            </div>
          </div>
        `;
          item
            .querySelector(".edit-btn")
            .addEventListener("click", renderEditMode);
        }
        function renderEditMode() {
          item.innerHTML = `
          <div>
            <span class="slash">차주</span>
            <div>
              <input class="inline-edit" value="${car.owner_name || ""}" id="edit_owner_${car.id}">
              <span class="slash">/</span>
              <input class="inline-edit" value="${car.phone_number || ""}" id="edit_phone_${car.id}">
            </div>
            <div>
              <input class="inline-edit" value="${car.owner_name2 || ""}" id="edit_owner2_${car.id}">
              <span class="slash">/</span>
              <input class="inline-edit" value="${car.phone_number2 || ""}" id="edit_phone2_${car.id}">
            </div>
          </div>
          <div style="margin-top: 10px;">
            <span class="slash">차량</span>
            <div>
              <input class="inline-edit" value="${car.car_number || ""}" id="edit_number_${car.id}">
              <span class="slash">/</span>
              <input class="inline-edit" value="${car.car_type || ""}" id="edit_type_${car.id}">
              <span class="slash">/</span>
              <input class="inline-edit" value="${car.car_color || ""}" id="edit_color_${car.id}">
              <button class="save-btn">저장</button>
              <button class="cancel-btn">취소</button>
            </div>
          </div>
        `;
          // 저장 버튼
          item
            .querySelector(".save-btn")
            .addEventListener("click", async () => {
              if (confirm("수정할거에요?")) {
                const updatedCar = {
                  owner_name: document.getElementById(`edit_owner_${car.id}`)
                    .value,
                  phone_number: document.getElementById(`edit_phone_${car.id}`)
                    .value,
                  owner_name2: document.getElementById(`edit_owner2_${car.id}`)
                    .value,
                  phone_number2: document.getElementById(
                    `edit_phone2_${car.id}`,
                  ).value,
                  car_number: document.getElementById(`edit_number_${car.id}`)
                    .value,
                  car_type: document.getElementById(`edit_type_${car.id}`)
                    .value,
                  car_color: document.getElementById(`edit_color_${car.id}`)
                    .value,
                };
                try {
                  const res = await fetch(`/update/${car.id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(updatedCar),
                  });
                  const data = await res.json();
                  alert(data.message || "수정 완료!");
                  // 화면 데이터 업데이트
                  Object.assign(car, updatedCar);
                  renderViewMode();
                } catch (err) {
                  console.error("❌ 수정 오류:", err);
                  alert("수정 실패 :(");
                }
              }
            });
          // 취소 버튼
          item
            .querySelector(".cancel-btn")
            .addEventListener("click", renderViewMode);
        }
        renderViewMode();
        document.getElementById("result").appendChild(item);
      }
      async function deleteCar(id) {
        if (!confirm(`차량 정보를 삭제할거죠?`)) return;
        const res = await fetch(`/delete/${id}`, {
          method: "DELETE",
        });
        const data = await res.json();
        alert("삭제 완료 :)");
        searchCar(true);
      }
      document.querySelector(".header").addEventListener("click", function () {
        window.location.reload();
      });
      function showTab(tabName) {
        document
          .querySelectorAll(".tab-button")
          .forEach((btn) => btn.classList.remove("active"));
        document
          .querySelectorAll(".section")
          .forEach((section) => section.classList.remove("active"));
        const section = document.getElementById(tabName);
        section.classList.add("active");
        const activeBtn = Array.from(
          document.querySelectorAll(".tab-button"),
        ).find((b) =>
          b.textContent.includes(
            tabName === "search"
              ? "검색"
              : tabName === "add"
                ? "추가"
                : "확인 사항",
          ),
        );
        if (activeBtn) activeBtn.classList.add("active");
        const resultDiv = document.getElementById("result");
        setTimeout(() => {
          if (tabName === "search") {
            document.getElementById("car_number")?.focus();
          }
          if (tabName === "add") {
            document.getElementById("add_car_number")?.focus();
          }
          if (tabName === "tasks") {
            document.getElementById("task_title")?.focus();
          }
        }, 0);
      }
      document.addEventListener("DOMContentLoaded", () => {
        const carNumberInput = document.getElementById("car_number");
        if (carNumberInput) {
          carNumberInput.focus();
        }
      });
    </script>
  </body>
