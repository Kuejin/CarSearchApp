<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Jua&display=swap"
      rel="stylesheet"
    />
    <title>Car Search</title>
    <style>
      html,
      body {
        overflow-x: hidden;
      }
      body {
        margin: 0;
        font-family: sans-serif;
        background:
          radial-gradient(
            circle at top left,
            #bfe7ff 0%,
            rgba(255, 255, 255, 0) 45%
          ),
          radial-gradient(
            circle at top right,
            #d8c7ff 0%,
            rgba(191, 231, 255, 0) 45%
          ),
          radial-gradient(
            circle at bottom,
            #ccd7ff 0%,
            rgba(216, 199, 255, 0) 45%
          ),
          linear-gradient(135deg, #ffffff 0%, #dff3ff 55%, #ddd2ff 100%);
        background-attachment: fixed;
        color: #1591dc;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        position: relative;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(
            circle at 20% 15%,
            rgba(255, 255, 255, 0.85),
            transparent 28%
          ),
          radial-gradient(
            circle at 85% 20%,
            rgba(122, 215, 255, 0.4),
            transparent 30%
          ),
          radial-gradient(
            circle at 50% 90%,
            rgba(188, 163, 255, 0.35),
            transparent 32%
          );
        pointer-events: none;
        z-index: -1;
      }
      body::after {
        content: "";
        position: fixed;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        right: -160px;
        top: -120px;
        background: radial-gradient(
          circle,
          rgba(110, 215, 255, 0.28),
          rgba(181, 163, 255, 0.12),
          transparent 72%
        );
        filter: blur(35px);
        z-index: -1;
        animation: floatGlow 10s ease-in-out infinite;
      }
      .search-group {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        /* 0.5초 대기 후 중앙으로 내려옴 */
        animation: slideToCenter 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s
          forwards;
      }
      .search-group.searched {
        animation: slideToTop 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      .header {
        position: fixed; /* 다시 상단 고정 */
        top: 0;
        left: 0;
        width: 100%;
        box-sizing: border-box; /* 패딩을 포함해서 100%를 맞춤 (가로 잘림 해결) */
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        color: #1591dc;
        font-family: "Great Vibes", cursive;
        font-size: 31px;
        font-weight: bold;
        padding: 12px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 8px 30px rgba(160, 170, 255, 0.15);
        z-index: 1000;
        transition:
          background 1.2s ease,
          color 1.2s ease,
          box-shadow 1.2s ease,
          transform 0.5s ease;
        text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
        letter-spacing: 1px;
      }
      .underline {
        text-decoration: underline;
      }
      .header.picked {
        background: linear-gradient(135deg, #66d0ff, #7eaeff, #bb9cff);
        color: white;
        box-shadow: 0 12px 35px rgba(118, 170, 255, 0.35);
        transform: scale(1.01);
      }
      .tabs {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 20px;
        width: 100%;
        max-width: 550px;
        margin-top: 80px; /* 다시 80px로 원복 */
      }
      .tab-button {
        flex: 1;
        padding: 13px 0;
        font-size: 17px;
        font-weight: 600;
        border: none;
        background: transparent;
        color: #7d8ea8;
        border-radius: 9999px;
        cursor: pointer;
        transition: all 0.35s ease;
      }
      .tab-button.active {
        background: linear-gradient(135deg, #67cbff, #7db8ff, #b395ff);
        color: white;
        font-weight: bold;
        box-shadow: 0 8px 22px rgba(108, 170, 255, 0.3);
        transform: translateY(-2px);
      }
      .tab-button:hover:not(.active) {
        background: rgba(255, 255, 255, 0.35);
        backdrop-filter: blur(10px);
        color: #1591dc;
      }
      #search_keyword {
        padding: 12px 30px;
        color: #193c67;
        height: 70px;
      }
      .section {
        display: none;
        width: 100%;
        max-width: 550px;
        background: transparent;
        padding: 0 20px 10px 20px;
        border-radius: 10px;
      }
      .section.active {
        display: block;
      }
      input {
        display: block;
        width: 100%;
        max-width: 500px;
        margin: 5px auto;
        padding: 12px;
        font-size: 17px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.88) 0%,
          rgba(255, 255, 255, 0.58) 18%,
          rgba(255, 255, 255, 0.4) 100%
        );
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-top: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 9999px;
        box-sizing: border-box;
        outline: none;
        color: #193c67;
        font-weight: 600;
        letter-spacing: 0.3px;
        box-shadow:
          inset 0 2px 2px rgba(255, 255, 255, 0.95),
          inset 0 -1px 1px rgba(255, 255, 255, 0.25),
          0 10px 28px rgba(17, 34, 64, 0.1);
        transition: all 0.25s ease;
        caret-color: #4e8fd8;
      }
      input.invalid {
        border: 2px solid red;
      }
      input:hover {
        transform: translateY(-1px);
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.95),
          rgba(255, 255, 255, 0.65)
        );
        box-shadow:
          inset 0 2px 2px rgba(255, 255, 255, 0.95),
          0 14px 30px rgba(17, 34, 64, 0.12);
      }
      input:focus {
        transform: translateY(-2px);
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 1),
          rgba(255, 255, 255, 0.72)
        );
        border-color: #7baeff;
        box-shadow:
          inset 0 2px 2px rgba(255, 255, 255, 1),
          0 0 0 4px rgba(123, 174, 255, 0.16),
          0 16px 34px rgba(17, 34, 64, 0.14);
      }
      #task_desc::placeholder {
        color: #4d4d4d;
      }
      input::placeholder {
        color: #8a9bb3;
        font-weight: 500;
      }
      #car_number,
      #add_car_number {
        padding: 20px;
        font-weight: bold;
      }
      .input-group {
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      .input-group input {
        width: 100%;
        max-width: 245px;
      }
      button {
        width: 100%;
        max-width: 500px;
        padding: 14px;
        font-size: 18px;
        background-color: #c4e2f5;
        border: none;
        border-radius: 9999px;
        cursor: pointer;
        margin: 0px auto 0;
      }
      .enter {
        background: linear-gradient(135deg, #69d2ff, #7bbdff, #b59cff);
        color: white;
        margin: 20px auto 0;
        display: block;
        border: none;
        box-shadow:
          inset 0 1px 1px rgba(255, 255, 255, 0.55),
          0 10px 25px rgba(100, 150, 255, 0.25);
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease,
          filter 0.25s ease;
      }
      button:hover {
        background-color: #c4e2f5;
        color: #1591dc;
      }
      .enter:hover {
        transform: translateY(-2px) scale(1.015);
        filter: brightness(1.05);
        box-shadow:
          inset 0 1px 1px rgba(255, 255, 255, 0.6),
          0 18px 35px rgba(110, 160, 255, 0.35);
      }
      .enter:active {
        transform: translateY(1px) scale(0.985);
        box-shadow:
          inset 0 2px 3px rgba(0, 0, 0, 0.08),
          0 6px 12px rgba(110, 160, 255, 0.18);
      }
      .task-item {
        margin-bottom: 20px;
        border-bottom: 1px solid #1591dc;
        padding-bottom: 10px;
        font-size: 1.2em;
        font-family: "Jua", sans-serif;
        background-color: white;
        border-radius: 10px;
        box-shadow: 0 6px 15px rgb(21, 145, 220, 0.35);
        padding: 15px;
      }
      .task-item button {
        float: right;
        width: 2.7em;
        height: 27px;
        font-size: 0.7em;
        font-family: "Jua", sans-serif;
        background-color: #c4e2f5;
        cursor: pointer;
        color: rgb(255, 57, 57);
        padding: 0;
      }
      .task-board {
        max-width: 550px;
        width: 100%;
        background-color: white;
        color: rgb(77, 77, 77);
        font-size: 1.2em;
        font-weight: bold;
        padding: 15px;
        border-radius: 10px;
        max-height: 400px;
        overflow-y: auto;
        font-family: "Jua", sans-serif;
        box-shadow: 0 6px 15px rgb(21, 145, 220, 0.35);
        margin-top: 20px;
      }
      #result {
        max-width: 550px;
        width: 100%;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.6),
          rgba(255, 255, 255, 0.34)
        );
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.55);
        box-shadow:
          0 30px 60px rgba(90, 120, 180, 0.15),
          inset 0 2px 2px rgba(255, 255, 255, 0.95),
          inset 0 -1px 1px rgba(255, 255, 255, 0.2);
        color: #173a63;
        padding: 0 18px;
        max-height: 420px;
        overflow-y: auto;
        font-size: 1.2em;
        font-weight: bold;
        font-family: "Jua", sans-serif;
        opacity: 0;
        transform: translateY(15px) scale(0.98);
        transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        margin-top: 25px;
      }
      #result.show {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      #result.tab-switch {
        transition: margin-top 0.3s ease;
        margin-top: 190px; /* 185px에서 190px로 수정됨 */
      }
      span.slash {
        color: #4e8fd8;
      }
      .result-item {
        padding: 15px 0px;
        font-size: 1.2em;
        border-top: 2px solid #1591dc;
        font-family: "Jua", sans-serif;
        color: #173a63;
        transition:
          transform 0.25s ease,
          background 0.25s ease,
          box-shadow 0.25s ease;
        opacity: 0;
        transform: translateY(12px);
        animation: fadeCard 0.35s ease forwards;
      }
      .result-item button {
        float: right;
        width: 2.7em;
        height: 27px;
        font-size: 0.7em;
        font-family: "Jua", sans-serif;
        background-color: #c4e2f5;
        cursor: pointer;
        color: rgb(255, 57, 57);
        padding: 0;
        margin-left: 5px;
      }
      .result-item input.inline-edit {
        display: inline-block;
        width: auto;
        min-width: 80px;
        font-size: inherit;
        font-family: inherit;
        padding: 2px 4px;
        margin: 0 3px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.65);
        color: #173a63;
        box-shadow: none;
      }

      /* --- 형광펜 CSS --- */
      .highlight {
        background-color: #ffeb3b;
        color: #173a63;
        border-radius: 3px;
        padding: 0 2px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      }

      /* --- 커스텀 토스트 알림 CSS --- */
      .custom-toast {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: #1591dc;
        padding: 12px 28px;
        border-radius: 9999px;
        font-family: "Jua", sans-serif;
        font-size: 1.15em;
        box-shadow: 0 10px 25px rgba(100, 150, 255, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.5);
        opacity: 0;
        transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        z-index: 9999;
        pointer-events: none; /* 클릭 방해 안 함 */
      }
      .custom-toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* --- 커스텀 컨펌(Confirm) 모달 CSS --- */
      .custom-confirm-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .custom-confirm-overlay.show {
        opacity: 1;
      }
      .custom-confirm-box {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.95),
          rgba(255, 255, 255, 0.8)
        );
        padding: 30px 40px;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(90, 120, 180, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.6);
        text-align: center;
        font-family: "Jua", sans-serif;
        color: #173a63;
        transform: scale(0.9);
        transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .custom-confirm-overlay.show .custom-confirm-box {
        transform: scale(1);
      }
      .custom-confirm-box p {
        font-size: 1.3em;
        margin-top: 0;
        margin-bottom: 25px;
      }
      .custom-confirm-btn-group {
        display: flex;
        gap: 15px;
        justify-content: center;
      }
      .custom-confirm-btn {
        width: 100px;
        padding: 10px;
        font-size: 1.1em;
        border-radius: 9999px;
        border: none;
        cursor: pointer;
        font-family: "Jua", sans-serif;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        margin: 0; /* 기존 button 마진 덮어쓰기 */
      }
      .custom-confirm-btn.yes {
        background: linear-gradient(135deg, #69d2ff, #7bbdff, #b59cff);
        color: white;
        box-shadow: 0 8px 20px rgba(100, 150, 255, 0.3);
      }
      .custom-confirm-btn.no {
        background: rgba(255, 255, 255, 0.6);
        color: #7d8ea8;
        border: 1px solid rgba(0, 0, 0, 0.1);
      }
      .custom-confirm-btn:hover {
        transform: translateY(-2px);
      }

      @media (max-width: 600px) {
        body {
          padding: 16px;
        }
        .tabs {
          flex-direction: row;
          flex-wrap: wrap;
          justify-content: center;
          gap: 10px;
          margin-top: 80px;
        }
        .tab-button {
          flex: 1 1 45%;
        }
        .input-group {
          flex-direction: row;
          flex-wrap: wrap;
          gap: 10px;
          justify-content: center;
        }
        .input-group input {
          flex: 1 1 45%;
          max-width: none;
        }
        input,
        .input-group input {
          width: 100%;
          font-size: 16px;
          padding: 14px;
        }
        .enter {
          font-size: 18px;
          padding: 16px;
        }
        #result {
          font-size: 15px;
          padding: 12px;
        }
        .header {
          font-size: 22px;
          top: 12px;
          left: 12px;
        }
      }
      @keyframes slideToCenter {
        0% {
          margin-top: 0;
        }
        100% {
          margin-top: 25vh; /* 화면의 1/4 지점만큼 밀어내림 (숫자 조절 가능) */
        }
      }
      @keyframes floatGlow {
        0% {
          transform: translateY(0px) translateX(0px);
        }
        50% {
          transform: translateY(25px) translateX(-20px);
        }
        100% {
          transform: translateY(0px) translateX(0px);
        }
      }
      @keyframes fadeCard {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes slideToTop {
        0% {
          margin-top: 25vh; /* 내려와 있던 위치 */
        }
        100% {
          margin-top: 0; /* 원래 위치(상단)로 복귀 */
        }
      }
    </style>
  </head>
  <body>
    <div class="header">Car <span class="underline">Info</span></div>
    <div class="search-group">
      <div class="tabs">
        <button class="tab-button active" onclick="goToSearchTab()">
          차량 검색
        </button>
        <button class="tab-button" onclick="goToAddTab()">차량 추가</button>
      </div>
      <!-- 차량 검색 -->
      <div id="search" class="section active">
        <form
          id="search-form"
          onsubmit="
            event.preventDefault();
            searchCar();
          "
        >
          <input
            id="search_keyword"
            autofocus
            placeholder="🔍 차량번호 · 차주 · 연락처 · 차종 · 색상"
          />
          <button type="submit" class="enter">Search</button>
        </form>
      </div>
      <!-- 차량 추가 -->
      <div id="add" class="section">
        <form
          id="add-form"
          onsubmit="
            event.preventDefault();
            addCar();
          "
        >
          <input placeholder="차량번호" id="add_car_number" />
          <div class="input-group">
            <input placeholder="차종" id="add_car_type" />
            <input placeholder="색상" id="add_car_color" />
          </div>
          <div class="input-group">
            <input placeholder="차주1" id="add_owner_name" />
            <input placeholder="연락처1" id="add_phone_number" />
          </div>
          <div class="input-group">
            <input placeholder="차주2" id="add_owner_name2" />
            <input placeholder="연락처2" id="add_phone_number2" />
          </div>
          <button type="submit" class="enter">Add</button>
        </form>
      </div>
    </div>
    <div id="result"></div>
    <script>
      // --- 커스텀 토스트 알림 함수 ---
      function showToast(message) {
        const toast = document.createElement("div");
        toast.className = "custom-toast";
        toast.innerText = message;
        document.body.appendChild(toast);

        // 렌더링 강제 업데이트 후 애니메이션 클래스 추가
        requestAnimationFrame(() => {
          toast.classList.add("show");
        });

        // 2.5초 후 사라짐
        setTimeout(() => {
          toast.classList.remove("show");
          setTimeout(() => {
            if (document.body.contains(toast)) {
              document.body.removeChild(toast);
            }
          }, 350); // CSS transition 시간 대기
        }, 2500);
      }

      // --- 커스텀 컨펌(Confirm) 모달 함수 (Promise 반환) ---
      function showConfirm(message) {
        return new Promise((resolve) => {
          const overlay = document.createElement("div");
          overlay.className = "custom-confirm-overlay";

          const box = document.createElement("div");
          box.className = "custom-confirm-box";

          const text = document.createElement("p");
          text.innerHTML = message;

          const btnGroup = document.createElement("div");
          btnGroup.className = "custom-confirm-btn-group";

          const yesBtn = document.createElement("button");
          yesBtn.className = "custom-confirm-btn yes";
          yesBtn.innerText = "네";

          const noBtn = document.createElement("button");
          noBtn.className = "custom-confirm-btn no";
          noBtn.innerText = "아니오";

          // 애니메이션 후 닫기 처리 함수
          const closeOverlay = (result) => {
            overlay.classList.remove("show");
            setTimeout(() => {
              if (document.body.contains(overlay)) {
                document.body.removeChild(overlay);
              }
              resolve(result);
            }, 300);
          };

          yesBtn.onclick = () => closeOverlay(true);
          noBtn.onclick = () => closeOverlay(false);

          btnGroup.appendChild(yesBtn);
          btnGroup.appendChild(noBtn);

          box.appendChild(text);
          box.appendChild(btnGroup);
          overlay.appendChild(box);

          document.body.appendChild(overlay);

          // 렌더링 강제 업데이트 후 표시
          requestAnimationFrame(() => {
            overlay.classList.add("show");
          });
        });
      }

      function goToAddTab() {
        document.getElementById("search").classList.remove("active");
        document.getElementById("add").classList.add("active");
        document.querySelectorAll(".tab-button")[0].classList.remove("active");
        document.querySelectorAll(".tab-button")[1].classList.add("active");
        const resultDiv = document.getElementById("result");
        resultDiv.innerHTML = "";
        resultDiv.classList.remove("show");
        resultDiv.classList.remove("tab-switch");
        resultDiv.style.marginTop = "25px";
      }

      function goToSearchTab() {
        document.getElementById("add").classList.remove("active");
        document.getElementById("search").classList.add("active");
        document.querySelectorAll(".tab-button")[1].classList.remove("active");
        document.querySelectorAll(".tab-button")[0].classList.add("active");
        const resultDiv = document.getElementById("result");
        resultDiv.classList.add("tab-switch");
        resultDiv.style.marginTop = "190px"; /* 185px에서 190px로 변경 */
      }

      // 형광펜 하이라이트 효과 추가 함수
      function highlightText(text, keyword) {
        if (!keyword) return text;
        const regex = new RegExp(`(${keyword})`, "gi");
        return text
          .toString()
          .replace(regex, `<span class="highlight">$1</span>`);
      }

      async function searchCar() {
        const keyword = document.getElementById("search_keyword").value;
        if (!keyword) {
          showToast("검색어를 입력해주세요.");
          return;
        }

        const searchGroup = document.querySelector(".search-group");
        const resultDiv = document.getElementById("result");

        // 검색 그룹을 위로 올림
        searchGroup.classList.add("searched");

        const header = document.querySelector(".header");
        header.classList.add("picked");

        // 검색 결과 창 띄우기
        resultDiv.innerHTML = "";
        resultDiv.classList.add("show");

        try {
          const response = await fetch(
            `/api/search?keyword=${encodeURIComponent(keyword)}`,
          );
          const data = await response.json();
          if (data.results && data.results.length > 0) {
            let html = "";
            data.results.forEach((car, index) => {
              const delay = index * 0.1;
              html += `
                <div class="result-item" style="animation-delay: ${delay}s" id="car-${car.id}">
                  차량 번호 : <span class="slash">/</span> 
                    <span class="view-mode">${highlightText(car.car_number, keyword)}</span>
                    <input type="text" class="edit-mode inline-edit" value="${car.car_number}" style="display:none;" data-field="car_number" /> <br>
                  차종 : <span class="slash">/</span> 
                    <span class="view-mode">${highlightText(car.car_type || "", keyword)}</span>
                    <input type="text" class="edit-mode inline-edit" value="${car.car_type || ""}" style="display:none;" data-field="car_type" /> <br>
                  색상 : <span class="slash">/</span> 
                    <span class="view-mode">${highlightText(car.car_color || "", keyword)}</span>
                    <input type="text" class="edit-mode inline-edit" value="${car.car_color || ""}" style="display:none;" data-field="car_color" /> <br>
                  차주1 : <span class="slash">/</span> 
                    <span class="view-mode">${highlightText(car.owner_name || "", keyword)}</span>
                    <input type="text" class="edit-mode inline-edit" value="${car.owner_name || ""}" style="display:none;" data-field="owner_name" /> <br>
                  연락처1 : <span class="slash">/</span> 
                    <span class="view-mode">${highlightText(car.phone_number || "", keyword)}</span>
                    <input type="text" class="edit-mode inline-edit" value="${car.phone_number || ""}" style="display:none;" data-field="phone_number" /> <br>
                  차주2 : <span class="slash">/</span> 
                    <span class="view-mode">${highlightText(car.owner_name2 || "", keyword)}</span>
                    <input type="text" class="edit-mode inline-edit" value="${car.owner_name2 || ""}" style="display:none;" data-field="owner_name2" /> <br>
                  연락처2 : <span class="slash">/</span> 
                    <span class="view-mode">${highlightText(car.phone_number2 || "", keyword)}</span>
                    <input type="text" class="edit-mode inline-edit" value="${car.phone_number2 || ""}" style="display:none;" data-field="phone_number2" /> <br>
                  <button class="delete-btn view-mode" onclick="deleteCar(${car.id})">삭제</button>
                  <button class="edit-btn view-mode" onclick="toggleEdit(${car.id})">수정</button>
                  
                  <button class="cancel-btn edit-mode" onclick="toggleEdit(${car.id})" style="display:none; color: gray;">취소</button>
                  <button class="save-btn edit-mode" onclick="saveCar(${car.id})" style="display:none; color: blue;">저장</button>
                </div>
              `;
            });
            resultDiv.innerHTML = html;
          } else {
            showToast("찾아도 안보여요");
          }
        } catch (error) {
          console.error(error);
          showToast("검색 중 오류가 발생했습니다.");
        }
      }

      function toggleEdit(id) {
        const itemDiv = document.getElementById(`car-${id}`);
        const viewModes = itemDiv.querySelectorAll(".view-mode");
        const editModes = itemDiv.querySelectorAll(".edit-mode");

        // 현재 보이는 모드에 따라 반전
        const isEditing = editModes[0].style.display === "inline-block";

        viewModes.forEach(
          (el) => (el.style.display = isEditing ? "inline-block" : "none"),
        );
        editModes.forEach(
          (el) => (el.style.display = isEditing ? "none" : "inline-block"),
        );
      }

      async function saveCar(id) {
        // 커스텀 Confirm (await 필요)
        const isConfirm = await showConfirm("수정할거에요?");
        if (!isConfirm) return;

        const itemDiv = document.getElementById(`car-${id}`);
        const inputs = itemDiv.querySelectorAll(".edit-mode.inline-edit");
        const updatedData = {};

        inputs.forEach((input) => {
          const field = input.getAttribute("data-field");
          updatedData[field] = input.value.trim();
        });

        try {
          const response = await fetch(`/api/cars/${id}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(updatedData),
          });

          const data = await response.json();
          if (response.ok) {
            showToast(data.message || "수정 완료!");
            searchCar(); // 수정 후 검색 결과 다시 불러오기
          } else {
            showToast(data.message || "수정 실패 :(");
          }
        } catch (error) {
          console.error(error);
          showToast("수정 중 오류가 발생했습니다.");
        }
      }

      async function addCar() {
        const car_number = document.getElementById("add_car_number").value;
        const car_type = document.getElementById("add_car_type").value;
        const car_color = document.getElementById("add_car_color").value;
        const owner_name = document.getElementById("add_owner_name").value;
        const phone_number = document.getElementById("add_phone_number").value;
        const owner_name2 = document.getElementById("add_owner_name2").value;
        const phone_number2 =
          document.getElementById("add_phone_number2").value;

        if (!car_number) {
          showToast("차량번호는 필수입니다.");
          document.getElementById("add_car_number").classList.add("invalid");
          return;
        }

        try {
          const response = await fetch("/api/cars", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              car_number,
              car_type,
              car_color,
              owner_name,
              phone_number,
              owner_name2,
              phone_number2,
            }),
          });
          const data = await response.json();
          if (response.ok) {
            showToast("등록 성공!");
            document.getElementById("add-form").reset();
            // 에러 표시 해제
            document
              .getElementById("add_car_number")
              .classList.remove("invalid");
          } else {
            showToast(data.message || "등록 실패!");
          }
        } catch (error) {
          console.error(error);
          showToast("등록 중 오류가 발생했습니다.");
        }
      }

      async function deleteCar(id) {
        // 커스텀 Confirm (await 필요)
        const isConfirm = await showConfirm("차량 정보를 삭제할거죠?");
        if (!isConfirm) return;

        try {
          const response = await fetch(`/api/cars/${id}`, {
            method: "DELETE",
          });
          if (response.ok) {
            showToast("삭제 완료 :)");
            searchCar(); // 삭제 후 검색 결과 다시 불러오기
          } else {
            showToast("삭제 실패 :(");
          }
        } catch (error) {
          console.error(error);
          showToast("삭제 중 오류가 발생했습니다.");
        }
      }
    </script>
  </body>
</html>
