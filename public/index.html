<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Jua&display=swap"
      rel="stylesheet"
    />
    <title>Car Search</title>
    <style>
      /* --- 커스텀 커서 적용 (기본: 블루, 포인트: 퍼플) --- */
      * {
        cursor:
          url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="%23ffb6c1" stroke="white" stroke-width="2" d="M4,4 L11,24 L14.5,14.5 L24,11 L4,4 Z"/></svg>')
            4 4,
          auto;
      }
      button,
      .tab-button,
      .filter-opt,
      .header,
      .custom-confirm-btn {
        /* 진한 핑크색(핫핑크) 포인트 커서 */
        cursor:
          url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="%23ff69b4" stroke="white" stroke-width="2" d="M4,4 L11,24 L14.5,14.5 L24,11 L4,4 Z"/></svg>')
            4 4,
          pointer !important;
      }
      input {
        cursor: text !important; /* 텍스트 입력창은 I빔 유지 */
      }
      html,
      body {
        overflow-x: hidden;
      }
      body {
        margin: 0;
        font-family: sans-serif;
        background:
          radial-gradient(
            circle at top left,
            #bfe7ff 0%,
            rgba(255, 255, 255, 0) 45%
          ),
          radial-gradient(
            circle at top right,
            #d8c7ff 0%,
            rgba(191, 231, 255, 0) 45%
          ),
          radial-gradient(
            circle at bottom,
            #ccd7ff 0%,
            rgba(216, 199, 255, 0) 45%
          ),
          linear-gradient(135deg, #ffffff 0%, #dff3ff 55%, #ddd2ff 100%);
        background-attachment: fixed;
        color: #1591dc;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        position: relative;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(
            circle at 20% 15%,
            rgba(255, 255, 255, 0.85),
            transparent 28%
          ),
          radial-gradient(
            circle at 85% 20%,
            rgba(122, 215, 255, 0.4),
            transparent 30%
          ),
          radial-gradient(
            circle at 50% 90%,
            rgba(188, 163, 255, 0.35),
            transparent 32%
          );
        pointer-events: none;
        z-index: -1;
      }
      body::after {
        content: "";
        position: fixed;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        right: -160px;
        top: -120px;
        background: radial-gradient(
          circle,
          rgba(110, 215, 255, 0.28),
          rgba(181, 163, 255, 0.12),
          transparent 72%
        );
        filter: blur(35px);
        z-index: -1;
        animation: floatGlow 10s ease-in-out infinite;
      }
      .search-group {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: slideToCenter 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s
          forwards;
      }
      .search-group.searched {
        animation: slideToTop 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      .header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        color: #1591dc;
        font-family: "Great Vibes", cursive;
        font-size: 31px;
        font-weight: bold;
        padding: 12px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 8px 30px rgba(160, 170, 255, 0.15);
        z-index: 1000;
        transition:
          background 1.2s ease,
          color 1.2s ease,
          box-shadow 1.2s ease,
          transform 0.5s ease;
        text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
        letter-spacing: 1px;
      }
      .underline {
        text-decoration: underline;
      }
      .header.picked {
        background: linear-gradient(135deg, #66d0ff, #7eaeff, #bb9cff);
        color: white;
        box-shadow: 0 12px 35px rgba(118, 170, 255, 0.35);
        transform: scale(1.01);
      }
      .tabs {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 20px;
        width: 100%;
        max-width: 550px;
        margin-top: 80px;
      }
      .tab-button {
        flex: 1;
        padding: 13px 0;
        font-size: 17px;
        font-weight: 600;
        border: none;
        background: transparent;
        color: #7d8ea8;
        border-radius: 9999px;
        transition: all 0.35s ease;
      }
      .tab-button.active {
        background: linear-gradient(135deg, #67cbff, #7db8ff, #b395ff);
        color: white;
        font-weight: bold;
        box-shadow: 0 8px 22px rgba(108, 170, 255, 0.3);
        transform: translateY(-2px);
      }
      .tab-button:hover:not(.active) {
        background: rgba(255, 255, 255, 0.35);
        backdrop-filter: blur(10px);
        color: #1591dc;
      }
      .search-input-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        max-width: 500px;
        margin: 5px auto;
      }
      #search_keyword {
        flex: 4;
        padding: 12px 25px;
        color: #193c67;
        height: 70px;
        margin: 0;
        max-width: none;
      }
      #filter-btn {
        flex: 1;
        height: 35px;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.9),
          rgba(255, 255, 255, 0.6)
        );
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 9999px;
        color: #193c67;
        font-family: "Jua", sans-serif;
        font-size: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 10px rgba(17, 34, 64, 0.08);
        transition: all 0.25s ease;
        user-select: none;
      }
      #filter-btn:hover {
        transform: translateY(-2px);
        background: rgba(255, 255, 255, 1);
        box-shadow: 0 6px 15px rgba(17, 34, 64, 0.12);
        border-color: #7baeff;
      }
      .filter-options-wrapper {
        position: absolute;
        left: 0;
        top: 100%;
        display: flex;
        justify-content: center;
        width: 100%;
        height: 0;
        margin-top: 0;
        overflow: hidden;
        transition:
          height 0.5s cubic-bezier(0.2, 0.8, 0.2, 1),
          margin-top 0.5s ease;
      }
      .filter-options-wrapper.open {
        height: 35px;
        margin-top: 3px;
      }
      .filter-options-container {
        display: flex;
        gap: 8px;
        overflow: hidden;
        max-width: 0;
        opacity: 0;
        white-space: nowrap;
        align-items: center;
        justify-content: center;
        transition:
          max-width 0.5s cubic-bezier(0.2, 0.8, 0.2, 1),
          opacity 0.4s ease;
        overflow-x: auto;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .filter-options-container.open {
        max-width: 600px;
        opacity: 1;
      }
      .filter-options-container::-webkit-scrollbar {
        display: none;
      }
      .filter-opt {
        padding: 5px 12px;
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 20px;
        font-family: "Jua", sans-serif;
        color: #7d8ea8;
        font-size: 14px;
        transition: all 0.3s;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }
      .filter-opt.active,
      .filter-opt:hover {
        background: linear-gradient(135deg, #67cbff, #7db8ff, #b395ff);
        color: white;
        border-color: transparent;
        box-shadow: 0 4px 10px rgba(108, 170, 255, 0.3);
      }
      .section {
        display: none;
        width: 100%;
        max-width: 550px;
        background: transparent;
        padding: 0 20px 10px 20px;
        border-radius: 10px;
      }
      .section.active {
        display: block;
      }
      input {
        display: block;
        width: 100%;
        max-width: 500px;
        margin: 5px auto;
        padding: 12px;
        font-size: 17px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.88) 0%,
          rgba(255, 255, 255, 0.58) 18%,
          rgba(255, 255, 255, 0.4) 100%
        );
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-top: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 9999px;
        box-sizing: border-box;
        outline: none;
        color: #193c67;
        font-weight: 600;
        letter-spacing: 0.3px;
        box-shadow:
          inset 0 2px 2px rgba(255, 255, 255, 0.95),
          inset 0 -1px 1px rgba(255, 255, 255, 0.25),
          0 10px 28px rgba(17, 34, 64, 0.1);
        transition: all 0.25s ease;
        caret-color: #ff69b4;
      }
      input.invalid {
        border: 2px solid red;
      }
      input:hover {
        transform: translateY(-1px);
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.95),
          rgba(255, 255, 255, 0.65)
        );
        box-shadow:
          inset 0 2px 2px rgba(255, 255, 255, 0.95),
          0 14px 30px rgba(17, 34, 64, 0.12);
      }
      input:focus {
        transform: translateY(-2px);
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 1),
          rgba(255, 255, 255, 0.72)
        );
        border-color: #7baeff;
        box-shadow:
          inset 0 2px 2px rgba(255, 255, 255, 1),
          0 0 0 4px rgba(123, 174, 255, 0.16),
          0 16px 34px rgba(17, 34, 64, 0.14);
      }
      input::placeholder {
        color: #8a9bb3;
        font-weight: 500;
      }
      .input-group {
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      .input-group input {
        width: 100%;
        max-width: 245px;
      }
      button {
        width: 100%;
        max-width: 500px;
        padding: 14px;
        font-size: 18px;
        background-color: #c4e2f5;
        border: none;
        border-radius: 9999px;
        margin: 0px auto 0;
      }
      .enter {
        background: linear-gradient(135deg, #69d2ff, #7bbdff, #b59cff);
        color: white;
        margin: 20px auto 0;
        display: block;
        border: none;
        box-shadow:
          inset 0 1px 1px rgba(255, 255, 255, 0.55),
          0 10px 25px rgba(100, 150, 255, 0.25);
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease,
          filter 0.25s ease;
      }
      .enter:hover {
        transform: translateY(-2px) scale(1.015);
        filter: brightness(1.05);
        box-shadow:
          inset 0 1px 1px rgba(255, 255, 255, 0.6),
          0 18px 35px rgba(110, 160, 255, 0.35);
      }
      .enter:active {
        transform: translateY(1px) scale(0.985);
        box-shadow:
          inset 0 2px 3px rgba(0, 0, 0, 0.08),
          0 6px 12px rgba(110, 160, 255, 0.18);
      }
      #search-form {
        position: relative;
      }
      #result {
        max-width: 550px;
        width: 100%;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.6),
          rgba(255, 255, 255, 0.34)
        );
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.55);
        box-shadow:
          0 30px 60px rgba(90, 120, 180, 0.15),
          inset 0 2px 2px rgba(255, 255, 255, 0.95),
          inset 0 -1px 1px rgba(255, 255, 255, 0.2);
        color: #173a63;
        padding: 0 18px;
        max-height: 420px;
        overflow-y: auto;
        font-size: 1.2em;
        font-weight: bold;
        font-family: "Jua", sans-serif;
        opacity: 0;
        transform: translateY(15px) scale(0.98);
        transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        margin-top: 35px;
      }
      #result.show {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      #result.tab-switch {
        transition: margin-top 0.3s ease;
        margin-top: 183px;
      }
      span.slash {
        color: #4e8fd8;
      }
      .result-item {
        padding: 15px 0px;
        font-size: 1.2em;
        border-top: 2px solid #1591dc;
        font-family: "Jua", sans-serif;
        color: #173a63;
        transition:
          transform 0.25s ease,
          background 0.25s ease,
          box-shadow 0.25s ease;
        opacity: 0;
        transform: translateY(12px);
        animation: fadeCard 0.35s ease forwards;
      }
      .result-item button {
        float: right;
        width: 2.7em;
        height: 27px;
        font-size: 0.7em;
        font-family: "Jua", sans-serif;
        background-color: #c4e2f5;
        color: rgb(255, 57, 57);
        padding: 0;
        margin-left: 5px;
      }
      .result-item input.inline-edit {
        display: inline-block;
        width: auto;
        min-width: 80px;
        font-size: inherit;
        font-family: inherit;
        padding: 2px 4px;
        margin: 0 3px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.65);
        color: #173a63;
        box-shadow: none;
      }
      .highlight {
        background-color: #ffeb3b;
        color: #173a63;
        border-radius: 3px;
        padding: 0 2px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      }
      .custom-toast {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: #1591dc;
        padding: 12px 28px;
        border-radius: 9999px;
        font-family: "Jua", sans-serif;
        font-size: 1.15em;
        box-shadow: 0 10px 25px rgba(100, 150, 255, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.5);
        opacity: 0;
        transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        z-index: 9999;
        pointer-events: none;
      }
      .custom-toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .custom-confirm-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .custom-confirm-overlay.show {
        opacity: 1;
      }
      .custom-confirm-box {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.95),
          rgba(255, 255, 255, 0.8)
        );
        padding: 30px 40px;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(90, 120, 180, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.6);
        text-align: center;
        font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
        font-weight: 500;
        color: #173a63;
        transform: scale(0.9);
        transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .custom-confirm-overlay.show .custom-confirm-box {
        transform: scale(1);
      }
      .custom-confirm-box p {
        font-size: 1.3em;
        margin-top: 0;
        margin-bottom: 25px;
      }
      .custom-confirm-btn-group {
        display: flex;
        gap: 15px;
        justify-content: center;
      }
      .custom-confirm-btn {
        width: 100px;
        padding: 10px;
        font-size: 1.1em;
        border-radius: 9999px;
        border: none;
        font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        margin: 0;
      }
      .custom-confirm-btn.yes {
        background: linear-gradient(135deg, #69d2ff, #7bbdff, #b59cff);
        color: white;
        box-shadow: 0 8px 20px rgba(100, 150, 255, 0.3);
      }
      .custom-confirm-btn.no {
        background: rgba(255, 255, 255, 0.6);
        color: #7d8ea8;
        border: 1px solid rgba(0, 0, 0, 0.1);
      }
      .custom-confirm-btn:hover {
        transform: translateY(-2px);
      }
      @media (max-width: 600px) {
        body {
          padding: 16px;
        }
        .tabs {
          flex-direction: row;
          flex-wrap: wrap;
          justify-content: center;
          gap: 10px;
          margin-top: 80px;
        }
        .tab-button {
          flex: 1 1 45%;
        }
        .input-group {
          flex-direction: row;
          flex-wrap: wrap;
          gap: 10px;
          justify-content: center;
        }
        .input-group input {
          flex: 1 1 45%;
          max-width: none;
        }
        input,
        .input-group input {
          width: 100%;
          font-size: 16px;
          padding: 14px;
        }
        .enter {
          font-size: 18px;
          padding: 16px;
        }
        #result {
          font-size: 15px;
          padding: 12px;
        }
        .header {
          font-size: 22px;
          top: 0;
          left: 0;
        }
        #filter-btn {
          font-size: 13px;
        }
      }
      @keyframes slideToCenter {
        0% {
          margin-top: 0;
        }
        100% {
          margin-top: 25vh;
        }
      }
      @keyframes floatGlow {
        0% {
          transform: translateY(0px) translateX(0px);
        }
        50% {
          transform: translateY(25px) translateX(-20px);
        }
        100% {
          transform: translateY(0px) translateX(0px);
        }
      }
      @keyframes fadeCard {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes slideToTop {
        0% {
          margin-top: 25vh;
        }
        100% {
          margin-top: 0;
        }
      }
      /* --- 다크 모드 (CSS 오로라 배경 및 유리 질감 네이비 테마) --- */
      body.dark-mode {
        /* 2. 초록, 보라, 분홍빛이 감도는 CSS 오로라 배경 (이미지 대신 코드 사용) */
        background:
          radial-gradient(
            circle at 15% 30%,
            rgba(0, 255, 153, 0.25) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 85% 20%,
            rgba(179, 0, 255, 0.25) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 50% 80%,
            rgba(255, 105, 180, 0.2) 0%,
            transparent 50%
          ),
          linear-gradient(135deg, #0b0e14 0%, #17172e 50%, #0f172a 100%) !important; /* 깊은 밤하늘 베이스 */
        background-attachment: fixed !important;
        color: #e2e8f0;
      }
      body.dark-mode::before,
      body.dark-mode::after {
        display: none !important;
      }
      body.dark-mode * {
        cursor:
          url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="%23facc15" stroke="white" stroke-width="2" d="M4,4 L11,24 L14.5,14.5 L24,11 L4,4 Z"/></svg>')
            4 4,
          auto !important;
      }
      body.dark-mode button,
      body.dark-mode .tab-button,
      body.dark-mode .filter-opt,
      body.dark-mode .header,
      body.dark-mode .custom-confirm-btn {
        cursor:
          url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="%23fef08a" stroke="white" stroke-width="2" d="M4,4 L11,24 L14.5,14.5 L24,11 L4,4 Z"/></svg>')
            4 4,
          pointer !important;
      }
      body.dark-mode .header,
      body.dark-mode .header.picked,
      body.dark-mode .enter,
      body.dark-mode .tab-button,
      body.dark-mode .filter-opt,
      body.dark-mode .custom-toast {
        box-shadow: none !important;
        text-shadow: none !important;
      }
      body.dark-mode .header {
        background: rgba(11, 14, 20, 0.7);
        color: #e2e8f0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      }
      body.dark-mode .header.picked {
        background: rgba(15, 76, 117, 0.85);
        color: #ffffff;
      }
      body.dark-mode input {
        background: rgba(17, 34, 64, 0.5) !important;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: #ffffff !important;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 15px rgba(200, 200, 200, 0.4) !important; /* 상하좌우 균일한 밝은 회색 그림자 */
        caret-color: #facc15;
      }
      body.dark-mode input:focus {
        background: rgba(17, 34, 64, 0.7) !important;
        border-color: #facc15;
        box-shadow: 0 0 18px rgba(250, 204, 21, 0.3) !important; /* 포커스 시 노란빛 그림자 */
      }
      body.dark-mode #result,
      body.dark-mode .custom-confirm-box {
        background: rgba(15, 23, 42, 0.85);
        color: #e2e8f0;
        border: 1px solid rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(8px);
      }
      body.dark-mode .result-item {
        border-top-color: rgba(255, 255, 255, 0.1);
        color: #cbd5e1;
      }
      body.dark-mode span.slash {
        color: #facc15;
      }
      body.dark-mode .highlight {
        background-color: rgba(250, 204, 21, 0.25);
        color: #facc15;
      }
      body.dark-mode .tab-button:not(.active) {
        color: #cbd5e1;
      }
      body.dark-mode #filter-btn,
      body.dark-mode .filter-opt {
        background: rgba(255, 255, 255, 0.12);
        color: #cbd5e1;
        border-color: rgba(255, 255, 255, 0.2);
      }
      body.dark-mode .custom-toast {
        background: rgba(15, 23, 42, 0.95);
        color: #e2e8f0;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      body.dark-mode .enter,
      body.dark-mode .tab-button.active,
      body.dark-mode .filter-opt.active,
      body.dark-mode .filter-opt:hover,
      body.dark-mode .custom-confirm-btn.yes {
        background: #1e5f8a;
        color: #ffffff;
        border-color: transparent;
      }
      body.dark-mode .custom-confirm-btn.no {
        background: rgba(255, 255, 255, 0.15);
        color: #cbd5e1;
        border-color: rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="header">
      Car <span class="underline">Info</span>
      <div
        id="theme-toggle"
        style="
          float: right;
          cursor: pointer;
          font-style: normal;
          font-size: 24px;
          margin-top: -2px;
        "
      >
        🌙
      </div>
    </div>
    <div class="search-group">
      <div class="tabs">
        <button class="tab-button active" onclick="goToSearchTab()">
          차량 검색
        </button>
        <button class="tab-button" onclick="goToAddTab()">차량 추가</button>
      </div>
      <!-- 차량 검색 -->
      <div id="search" class="section active">
        <form
          id="search-form"
          onsubmit="
            event.preventDefault();
            searchCar();
          "
        >
          <div class="search-input-wrapper">
            <input
              id="search_keyword"
              autofocus
              placeholder="🔍 차량번호 · 차주 · 연락처 · 차종 · 색상"
            />
            <div id="filter-btn">전체 ▾</div>
          </div>
          <button type="submit" class="enter">Search</button>
          <div class="filter-options-wrapper">
            <div class="filter-options-container" id="filter-options">
              <span class="filter-opt active" data-filter="all">전체</span>
              <span class="filter-opt" data-filter="car_number">차 번호</span>
              <span class="filter-opt" data-filter="owner_name">차주</span>
              <span class="filter-opt" data-filter="phone_number">연락처</span>
              <span class="filter-opt" data-filter="car_type">차종</span>
              <span class="filter-opt" data-filter="car_color">색상</span>
            </div>
          </div>
        </form>
      </div>
      <!-- 차량 추가 -->
      <div id="add" class="section">
        <form
          id="add-form"
          onsubmit="
            event.preventDefault();
            addCar();
          "
        >
          <input placeholder="차량번호" id="add_car_number" />
          <div class="input-group">
            <input placeholder="차종" id="add_car_type" />
            <input placeholder="색상" id="add_car_color" />
          </div>
          <div class="input-group">
            <input placeholder="차주1" id="add_owner_name" />
            <input placeholder="연락처1" id="add_phone_number" />
          </div>
          <div class="input-group">
            <input placeholder="차주2" id="add_owner_name2" />
            <input placeholder="연락처2" id="add_phone_number2" />
          </div>
          <button type="submit" class="enter">Add</button>
        </form>
      </div>
    </div>
    <div id="result"></div>
    <script>
      // --- 글로벌 상태 관리 (검색 데이터 & 필터링 상태) ---
      let currentSearchData = [];
      let currentFilter = "all";
      const header = document.querySelector(".header");
      // --- ESC 키 누를 시 모든 Input 지우기 이벤트 추가 ---
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          document.querySelectorAll("input").forEach((input) => {
            input.value = "";
          });
        }
      });
      // 원래 있던 클릭 시 헤더 색상 변경 (빈 공간 클릭 시 원래대로 복구)
      document.addEventListener("click", (e) => {
        if (e.target.tagName.toLowerCase() === "input") {
          header.classList.add("picked");
        } else {
          header.classList.remove("picked");
        }
      });
      // 입력창에 내용을 타이핑(입력)할 때 헤더 색상 변경
      document.addEventListener("input", (e) => {
        if (e.target.tagName.toLowerCase() === "input") {
          header.classList.add("picked");
        }
      });
      // --- 필터 버튼 및 옵션 이벤트 리스너 ---
      document.getElementById("filter-btn").addEventListener("click", () => {
        document
          .querySelector(".filter-options-wrapper")
          .classList.toggle("open");
        document.getElementById("filter-options").classList.toggle("open");
      });
      document.querySelectorAll(".filter-opt").forEach((opt) => {
        opt.addEventListener("click", (e) => {
          document
            .querySelectorAll(".filter-opt")
            .forEach((o) => o.classList.remove("active"));
          e.target.classList.add("active");
          currentFilter = e.target.getAttribute("data-filter");
          document.getElementById("filter-btn").innerText =
            `${e.target.innerText} ▾`;
          if (currentSearchData.length > 0) {
            applyFilterAndRender();
          }
        });
      });
      // --- 커스텀 토스트 알림 함수 ---
      function showToast(message) {
        const toast = document.createElement("div");
        toast.className = "custom-toast";
        toast.innerText = message;
        document.body.appendChild(toast);
        requestAnimationFrame(() => toast.classList.add("show"));
        setTimeout(() => {
          toast.classList.remove("show");
          setTimeout(() => {
            if (document.body.contains(toast)) document.body.removeChild(toast);
          }, 350);
        }, 2500);
      }
      // --- 커스텀 컨펌(Confirm) 모달 함수 ---
      function showConfirm(message) {
        return new Promise((resolve) => {
          const overlay = document.createElement("div");
          overlay.className = "custom-confirm-overlay";
          const box = document.createElement("div");
          box.className = "custom-confirm-box";
          const text = document.createElement("p");
          text.innerHTML = message;
          const btnGroup = document.createElement("div");
          btnGroup.className = "custom-confirm-btn-group";
          const yesBtn = document.createElement("button");
          yesBtn.className = "custom-confirm-btn yes";
          yesBtn.innerText = "네";
          const noBtn = document.createElement("button");
          noBtn.className = "custom-confirm-btn no";
          noBtn.innerText = "아니오";
          const closeOverlay = (result) => {
            overlay.classList.remove("show");
            setTimeout(() => {
              if (document.body.contains(overlay))
                document.body.removeChild(overlay);
              resolve(result);
            }, 300);
          };
          yesBtn.onclick = () => closeOverlay(true);
          noBtn.onclick = () => closeOverlay(false);
          btnGroup.appendChild(yesBtn);
          btnGroup.appendChild(noBtn);
          box.appendChild(text);
          box.appendChild(btnGroup);
          overlay.appendChild(box);
          document.body.appendChild(overlay);
          requestAnimationFrame(() => overlay.classList.add("show"));
        });
      }
      function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }
      function highlightText(text, keyword) {
        if (!text || !keyword) return text || "";
        const safeKeyword = escapeRegExp(keyword);
        const regex = new RegExp(`(${safeKeyword})`, "gi");
        return String(text).replace(regex, '<span class="highlight">$1</span>');
      }
      // --- 실제 필터링 및 렌더링을 담당하는 함수 ---
      function applyFilterAndRender(silent = false) {
        const resultDiv = document.getElementById("result");
        const searchGroup = document.querySelector(".search-group");
        const keyword = document.getElementById("search_keyword").value.trim();
        resultDiv.classList.remove("show");
        resultDiv.innerHTML = "";
        let filteredData = currentSearchData;
        if (currentFilter !== "all") {
          filteredData = currentSearchData.filter((car) => {
            const val = car[currentFilter] || "";
            if (currentFilter === "owner_name") {
              return (
                val.includes(keyword) ||
                (car.owner_name2 && car.owner_name2.includes(keyword))
              );
            }
            if (currentFilter === "phone_number") {
              return (
                val.includes(keyword) ||
                (car.phone_number2 && car.phone_number2.includes(keyword))
              );
            }
            return val.includes(keyword);
          });
        }
        if (Array.isArray(filteredData) && filteredData.length > 0) {
          filteredData.forEach((car) => renderCarItem(car, keyword));
          setTimeout(() => {
            resultDiv.classList.add("show");
            searchGroup.classList.add("searched");
          }, 10);
        } else {
          searchGroup.classList.remove("searched");
          if (!silent) showToast("필터 조건에 맞는 결과가 없어요.");
        }
      }
      async function searchCar(silent = false) {
        const keyword = document.getElementById("search_keyword").value.trim();
        const searchGroup = document.querySelector(".search-group");
        if (!keyword) {
          const resultDiv = document.getElementById("result");
          resultDiv.classList.remove("show");
          resultDiv.innerHTML = "";
          searchGroup.classList.remove("searched");
          if (!silent) showToast("검색어를 입력해주세요.");
          return;
        }
        const params = new URLSearchParams();
        params.append("keyword", keyword);
        try {
          const res = await fetch(`/search?${params}`);
          const data = await res.json();
          currentSearchData = data;
          applyFilterAndRender(silent);
        } catch (err) {
          console.error("검색 오류:", err);
          showToast("검색 중 오류가 발생했습니다.");
        }
      }
      async function addCar() {
        const requiredIds = [
          "add_car_number",
          "add_car_type",
          "add_car_color",
          "add_owner_name",
          "add_phone_number",
        ];
        const allFilled = requiredIds.every(
          (id) => document.getElementById(id).value.trim() !== "",
        );
        if (!allFilled) {
          showToast("필수 정보를 채워주세요");
          return;
        }
        const body = {
          car_number: document.getElementById("add_car_number").value,
          car_type: document.getElementById("add_car_type").value,
          car_color: document.getElementById("add_car_color").value,
          owner_name: document.getElementById("add_owner_name").value,
          owner_name2: document.getElementById("add_owner_name2").value || null,
          phone_number: document.getElementById("add_phone_number").value,
          phone_number2:
            document.getElementById("add_phone_number2").value || null,
        };
        const confirmMsg = `
          <div style="font-size: 0.9em; margin-bottom: 10px; line-height: 1.5;">
            <span style="color: #4e8fd8;">[차량]</span> ${body.car_number} / ${body.car_type} / ${body.car_color}<br>
            <span style="color: #4e8fd8;">[차주1]</span> ${body.owner_name} (${body.phone_number})<br>
            ${body.owner_name2 ? `<span style="color: #4e8fd8;">[차주2]</span> ${body.owner_name2} (${body.phone_number2})<br>` : ""}
          </div>
          이대로 등록하실 건가요?
        `;
        const isConfirm = await showConfirm(confirmMsg);
        if (!isConfirm) return;
        try {
          const res = await fetch("/add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          if (res.ok) {
            showToast("등록 성공!");
            [
              "add_car_number",
              "add_car_type",
              "add_car_color",
              "add_owner_name",
              "add_owner_name2",
              "add_phone_number",
              "add_phone_number2",
            ].forEach((id) => {
              const input = document.getElementById(id);
              if (input) input.value = "";
            });
          } else {
            showToast(data.message || "등록 실패!");
          }
        } catch (err) {
          console.error(err);
          showToast("등록 중 오류가 발생했습니다.");
        }
      }
      function renderCarItem(car, keyword = "") {
        const item = document.createElement("div");
        item.className = "result-item";
        function renderViewMode() {
          item.innerHTML = `
          <div>
            <span class="slash">차주</span>
            <div>
              ${highlightText(car.owner_name, keyword)} (${highlightText(car.phone_number, keyword)})
            </div>
            ${car.owner_name2 ? `<div>${highlightText(car.owner_name2, keyword)} (${highlightText(car.phone_number2 || "", keyword)})</div>` : ""}
          </div>
          <div style="margin-top: 10px;">
            <span class="slash">차량</span>
            <div>
              ${highlightText(car.car_number, keyword)}
              <span class="slash">/</span> ${highlightText(car.car_type, keyword)}
              <span class="slash">/</span> ${highlightText(car.car_color, keyword)}
              <button onclick="deleteCar(${car.id})">삭제</button>
              <button class="edit-btn">수정</button>
            </div>
          </div>
        `;
          item
            .querySelector(".edit-btn")
            .addEventListener("click", renderEditMode);
        }
        function renderEditMode() {
          item.innerHTML = `
          <div>
            <span class="slash">차주</span>
            <div>
              <input class="inline-edit" value="${car.owner_name || ""}" id="edit_owner_${car.id}">
              <span class="slash">/</span>
              <input class="inline-edit" value="${car.phone_number || ""}" id="edit_phone_${car.id}">
            </div>
            <div>
              <input class="inline-edit" value="${car.owner_name2 || ""}" id="edit_owner2_${car.id}">
              <span class="slash">/</span>
              <input class="inline-edit" value="${car.phone_number2 || ""}" id="edit_phone2_${car.id}">
            </div>
          </div>
          <div style="margin-top: 10px;">
            <span class="slash">차량</span>
            <div>
              <input class="inline-edit" value="${car.car_number || ""}" id="edit_number_${car.id}">
              <span class="slash">/</span>
              <input class="inline-edit" value="${car.car_type || ""}" id="edit_type_${car.id}">
              <span class="slash">/</span>
              <input class="inline-edit" value="${car.car_color || ""}" id="edit_color_${car.id}">
              <button class="save-btn">저장</button>
              <button class="cancel-btn">취소</button>
            </div>
          </div>
        `;
          item
            .querySelector(".save-btn")
            .addEventListener("click", async () => {
              // --- 수정 모달 데이터 및 멘트 변경 부분 ---
              const updatedCar = {
                owner_name: document.getElementById(`edit_owner_${car.id}`)
                  .value,
                phone_number: document.getElementById(`edit_phone_${car.id}`)
                  .value,
                owner_name2: document.getElementById(`edit_owner2_${car.id}`)
                  .value,
                phone_number2: document.getElementById(`edit_phone2_${car.id}`)
                  .value,
                car_number: document.getElementById(`edit_number_${car.id}`)
                  .value,
                car_type: document.getElementById(`edit_type_${car.id}`).value,
                car_color: document.getElementById(`edit_color_${car.id}`)
                  .value,
              };
              const confirmMsg = `
                <div style="font-size: 0.9em; margin-bottom: 10px; line-height: 1.5;">
                  <span style="color: #4e8fd8;">[차량]</span> ${updatedCar.car_number} / ${updatedCar.car_type} / ${updatedCar.car_color}<br>
                  <span style="color: #4e8fd8;">[차주1]</span> ${updatedCar.owner_name} (${updatedCar.phone_number})<br>
                  ${updatedCar.owner_name2 ? `<span style="color: #4e8fd8;">[차주2]</span> ${updatedCar.owner_name2} (${updatedCar.phone_number2})<br>` : ""}
                </div>
                이대로 등록하실 건가요?
              `;
              const isConfirm = await showConfirm(confirmMsg);
              if (isConfirm) {
                try {
                  const res = await fetch(`/update/${car.id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(updatedCar),
                  });
                  const data = await res.json();
                  showToast(data.message || "수정 완료!");
                  Object.assign(car, updatedCar);
                  renderViewMode();
                } catch (err) {
                  console.error("❌ 수정 오류:", err);
                  showToast("수정 실패 :(");
                }
              }
            });
          item
            .querySelector(".cancel-btn")
            .addEventListener("click", renderViewMode);
        }
        renderViewMode();
        document.getElementById("result").appendChild(item);
      }
      async function deleteCar(id) {
        const isConfirm = await showConfirm("차량 정보를 삭제할거죠?");
        if (!isConfirm) return;
        try {
          const res = await fetch(`/delete/${id}`, { method: "DELETE" });
          const data = await res.json();
          showToast("삭제 완료 :)");
          searchCar(true);
        } catch (err) {
          console.error(err);
          showToast("삭제 중 오류가 발생했습니다.");
        }
      }
      document.querySelector(".header").addEventListener("click", function () {
        window.location.reload();
      });
      function showTab(tabName) {
        document
          .querySelectorAll(".tab-button")
          .forEach((btn) => btn.classList.remove("active"));
        document
          .querySelectorAll(".section")
          .forEach((section) => section.classList.remove("active"));
        const section = document.getElementById(tabName);
        section.classList.add("active");
        const activeBtn = Array.from(
          document.querySelectorAll(".tab-button"),
        ).find((b) =>
          b.textContent.includes(
            tabName === "search"
              ? "검색"
              : tabName === "add"
                ? "추가"
                : "확인 사항",
          ),
        );
        if (activeBtn) activeBtn.classList.add("active");
        const resultDiv = document.getElementById("result");
        setTimeout(() => {
          if (tabName === "add")
            document.getElementById("add_car_number")?.focus();
        }, 0);
      }
      function goToAddTab() {
        const resultDiv = document.getElementById("result");
        if (!resultDiv || resultDiv.innerHTML.trim() === "") {
          showTab("add");
          return;
        }
        resultDiv.classList.add("tab-switch");
        setTimeout(() => {
          showTab("add");
          resultDiv.style.transition = "none";
          resultDiv.style.marginTop = "";
          resultDiv.classList.remove("tab-switch");
          requestAnimationFrame(() => {
            resultDiv.style.transition = "";
          });
        }, 300);
      }
      function goToSearchTab() {
        const resultDiv = document.getElementById("result");
        if (!resultDiv || resultDiv.innerHTML.trim() === "") {
          showTab("search");
          return;
        }
        resultDiv.style.transition = "none";
        resultDiv.style.marginTop = "183px";
        resultDiv.offsetHeight;
        resultDiv.style.transition = "margin-top .3s ease";
        requestAnimationFrame(() => {
          showTab("search");
          resultDiv.style.marginTop = "";
        });
      }
      // --- 다크 모드 토글 기능 ---
      const themeToggle = document.getElementById("theme-toggle");
      themeToggle.addEventListener("click", (e) => {
        e.stopPropagation(); // 헤더 클릭 시 새로고침 방지
        document.body.classList.toggle("dark-mode");
        if (document.body.classList.contains("dark-mode")) {
          themeToggle.innerText = "☀️"; // 다크모드일 땐 해 아이콘으로 변경
        } else {
          themeToggle.innerText = "🌙"; // 라이트모드일 땐 달 아이콘으로 변경
        }
      });
      // --- 입력 폼 자동 포맷팅 (전화번호 하이픈, 차량번호 띄어쓰기) ---
      document.addEventListener("input", (e) => {
        const id = e.target.id;
        if (!id) return;
        // 1. 전화번호 (add_phone_number, edit_phone_ 등 아이디에 phone이 포함된 경우)
        if (id.includes("phone")) {
          let val = e.target.value.replace(/[^0-9]/g, ""); // 숫자만 남기기
          let res = "";
          if (val.length < 4) {
            res = val;
          } else if (val.length < 7) {
            res = val.substr(0, 3) + "-" + val.substr(3);
          } else if (val.length < 11) {
            res =
              val.substr(0, 3) + "-" + val.substr(3, 3) + "-" + val.substr(6);
          } else {
            res =
              val.substr(0, 3) + "-" + val.substr(3, 4) + "-" + val.substr(7);
          }
          e.target.value = res;
        }
        // 2. 차량번호 (add_car_number, edit_number_ 등)
        if (id.includes("add_car_number") || id.includes("edit_number")) {
          let val = e.target.value.replace(/\s+/g, ""); // 공백 제거
          // 정규식: 앞자리 2~3자리 숫자+한글, 뒷자리 4자리 숫자
          const match = val.match(/^(\d{2,3}[가-힣])(\d{1,4})$/);
          if (match) {
            e.target.value = `${match[1]} ${match[2]}`; // 가운데 띄어쓰기 추가
          } else {
            e.target.value = val;
          }
        }
      });
    </script>
  </body>
</html>
